# Post-deploy verification
#
# Runs Nucel QA against a freshly-deployed environment (staging, preview, prod
# canary). No PR is involved, so the report is uploaded as an artifact and
# (optionally) posted to Slack.
#
# This workflow is intended to be invoked one of two ways:
#   1. workflow_dispatch — manual trigger with a target URL
#   2. workflow_run     — chained off a successful "Deploy" workflow
#
# Requirements:
#   - secrets.ANTHROPIC_API_KEY
#   - (optional) secrets.SLACK_WEBHOOK_URL for the notify step

name: QA on deploy

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to test (e.g. https://staging.example.com)'
        required: true
        type: string
      personas:
        description: 'Comma-separated personas (leave empty for all 7)'
        required: false
        type: string
        default: ''
  workflow_run:
    workflows: ['Deploy staging']
    types: [completed]

permissions:
  contents: read

jobs:
  qa:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Fallback when triggered by workflow_run (no dispatch input available).
      DEFAULT_STAGING_URL: 'https://staging.example.com'
    steps:
      - name: Resolve target URL
        id: resolve
        env:
          DISPATCH_URL: ${{ inputs.target_url }}
        run: |
          if [ -n "$DISPATCH_URL" ]; then
            echo "url=$DISPATCH_URL" >> "$GITHUB_OUTPUT"
          else
            echo "url=$DEFAULT_STAGING_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Nucel QA
        id: qa
        uses: nucel-dev/qa-action@v1
        with:
          url: ${{ steps.resolve.outputs.url }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          personas: ${{ inputs.personas }}
          comment-on-pr: 'false'   # no PR context for deploy verification

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nucel-qa-report-${{ github.run_id }}
          path: ${{ steps.qa.outputs.report-path }}
          if-no-files-found: warn

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FINDINGS: ${{ steps.qa.outputs.findings-count }}
          TARGET_URL: ${{ steps.resolve.outputs.url }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured — skipping notification"
            exit 0
          fi
          payload=$(jq -n \
            --arg status "$STATUS" \
            --arg findings "$FINDINGS" \
            --arg url "$TARGET_URL" \
            --arg run "$RUN_URL" \
            '{text: "Nucel QA on \($url): status=\($status), findings=\($findings) — \($run)"}')
          curl -fsSL -X POST -H 'Content-Type: application/json' \
            --data "$payload" "$SLACK_WEBHOOK_URL"
